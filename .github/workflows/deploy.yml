name: Deploy site

# Builds the static site from the committed content snapshot and pushes it to
# scshafe/scshafe.github.io, which GitHub Pages then serves automatically.
#
# Publishing new CMS content therefore requires: edit in author mode, run
# `npm run export:metadata`, commit content/metadata.json, push. Code-only
# changes just need a push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify content snapshot
        run: |
          node -e "
            const m = require('./content/metadata.json');
            if (!m.settings || !m.settings.site || !m.settings.site.site_name) {
              throw new Error('content/metadata.json looks empty or stale — locally run: npm run export:metadata, then commit content/metadata.json');
            }
            console.log('Snapshot OK —', m.nodes.length, 'node(s), site:', JSON.stringify(m.settings.site.site_name));
          "

      - name: Install dependencies
        run: npm ci

      - name: Validate project entries
        run: npm run projects:validate

      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_BUILD_MODE: publish

      - name: Deploy to scshafe.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: scshafe/scshafe.github.io
          publish_branch: master
          publish_dir: ./out
          full_commit_message: "Deploy from pages-generator@${{ github.sha }}"
